name: Check INDEX

on:
  workflow_dispatch:
  push:
    paths:
      - "RULES.md"
      - "index.html"
      - "tools/check_index.py"
      - ".github/workflows/check-index.yml"

permissions:
  contents: read

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run INDEX checker
        run: python tools/check_index.py
