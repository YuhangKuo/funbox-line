name: Validate Funbox

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "RULES.md"
      - "validate.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Run validator
        run: python validate.py
