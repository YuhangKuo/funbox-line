<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, "Noto Sans TC",
                 "Microsoft JhengHei", sans-serif;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 14px;
    line-height: 1.6;
    background: #f7f7f7;
    color: #222;
}

h1 {
    font-size: 1.55rem;
    margin: 0 0 4px;
}

.version {
    color: #888;
    font-size: .72rem;
    font-weight: 500;
}

.subtitle {
    color: #666;
    font-size: .9rem;
    margin-bottom: 16px;
}

.note {
    background: #fff3cd;
    padding: 11px 13px;
    border-radius: 9px;
    margin-bottom: 16px;
    font-size: .88rem;
}

.product-select {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 22px;
}

.product-btn {
    border: 2px solid #ddd;
    background: white;
    padding: 11px 8px;
    border-radius: 9px;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 700;
}

.product-btn.active {
    background: #222;
    color: white;
    border-color: #222;
}

.product-content {
    display: none;
}

.product-content.active {
    display: block;
}

.product-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 12px;
}

.region {
    margin-top: 22px;
}

.region h2 {
    background: #222;
    color: white;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 1.05rem;
    margin-bottom: 8px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: white;
    border-radius: 9px;
    overflow: hidden;
}

th,
td {
    padding: 9px 11px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

tr:last-child td {
    border-bottom: none;
}

.time {
    white-space: nowrap;
    color: #c33;
    font-size: .85rem;
}

.btn {
    display: inline-block;
    min-width: 86px;
    text-align: center;
    background: #06c755;
    color: white;
    text-decoration: none;
    padding: 7px 11px;
    border-radius: 7px;
    font-weight: 700;
    white-space: nowrap;
}

.btn:hover {
    opacity: .85;
}

.btn.done {
    background: #999;
    opacity: .55;
}

tr.done-row {
    opacity: .45;
}

.reset-btn {
    border: 0;
    background: #666;
    color: white;
    padding: 8px 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: .85rem;
    margin-bottom: 16px;
}

footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
    color: #777;
    font-size: .8rem;
}

footer a {
    color: inherit;
}

@media (max-width: 600px) {

    body {
        margin: 14px auto;
        padding: 0 10px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .product-select {
        grid-template-columns: 1fr;
    }

    .product-btn {
        padding: 12px;
    }

    thead {
        display: none;
    }

    table,
    tbody,
    tr,
    td {
        display: block;
        width: 100%;
    }

    tr {
        background: white;
        margin-bottom: 8px;
        padding: 10px 11px;
        border-radius: 9px;
        border: 1px solid #e5e5e5;
    }

    td {
        border: none;
        padding: 0;
    }

    td:first-child {
        font-weight: 700;
    }

    td:nth-child(2) {
        margin-top: 2px;
        margin-bottom: 8px;
    }

    .time {
        white-space: normal;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 9px;
    }

    .reset-btn {
        width: 100%;
    }
}
</style>

const products = {
    ux21: "UX-21 惡魔冥界改造組",
    ux20: "UX-20 榮耀武神",
    bx35: "BX-35 隨機強化組 Vol.04"
};


function createShopId(name) {

    return name
        .replace(/\s+/g, "")
        .replace(/[^\u4e00-\u9fffA-Za-z0-9]/g, "");

}


function getKey(button) {

    return "funbox-" +
           button.dataset.product +
           "-" +
           button.dataset.shop;

}


function renderProduct(product) {

    const container =
        document.getElementById(product);

    container.innerHTML = "";


    const title =
        document.createElement("div");

    title.className = "product-title";
    title.textContent = products[product];

    container.appendChild(title);


    const regions = [];

    shops.forEach(shop => {

        if (
            shop[product] &&
            !regions.includes(shop.region)
        ) {
            regions.push(shop.region);
        }

    });


    regions.forEach(region => {

        const regionDiv =
            document.createElement("div");

        regionDiv.className = "region";


        const heading =
            document.createElement("h2");

        heading.textContent = region;

        regionDiv.appendChild(heading);


        const table =
            document.createElement("table");


        table.innerHTML = `
            <thead>
                <tr>
                    <th>門市</th>
                    <th>開始時間</th>
                    <th>抽獎</th>
                </tr>
            </thead>
        `;


        const tbody =
            document.createElement("tbody");


        shops
            .filter(shop =>
                shop.region === region &&
                shop[product]
            )
            .forEach(shop => {

                const item = shop[product];

                const tr =
                    document.createElement("tr");


                const name =
                    document.createElement("td");

                name.textContent =
                    shop.name;


                const time =
                    document.createElement("td");

                time.className = "time";

                time.textContent =
                    item.time;


                const action =
                    document.createElement("td");


                const button =
                    document.createElement("a");

                button.className = "btn";

                button.href =
                    item.url;

                button.target = "_blank";
                button.rel = "noopener";

                button.dataset.product =
                    product;

                button.dataset.shop =
                    createShopId(shop.name);

                button.textContent =
                    "立即抽獎";


                action.appendChild(button);

                tr.appendChild(name);
                tr.appendChild(time);
                tr.appendChild(action);

                tbody.appendChild(tr);

            });


        table.appendChild(tbody);

        regionDiv.appendChild(table);

        container.appendChild(regionDiv);

    });

}


function showProduct(product, button) {

    document
        .querySelectorAll(".product-content")
        .forEach(content => {
            content.classList.remove("active");
        });


    document
        .getElementById(product)
        .classList.add("active");


    document
        .querySelectorAll(".product-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    button.classList.add("active");

}


function sortTable(table) {

    const tbody =
        table.querySelector("tbody");

    if (!tbody) {
        return;
    }


    const rows =
        Array.from(
            tbody.querySelectorAll("tr")
        );


    rows.sort((a, b) => {

        const aButton =
            a.querySelector(".btn");

        const bButton =
            b.querySelector(".btn");


        const aDone =
            localStorage.getItem(
                getKey(aButton)
            ) === "done";


        const bDone =
            localStorage.getItem(
                getKey(bButton)
            ) === "done";


        if (aDone && !bDone) {
            return 1;
        }

        if (!aDone && bDone) {
            return -1;
        }

        return 0;

    });


    rows.forEach(row => {
        tbody.appendChild(row);
    });

}


function applyDoneState() {

    document
        .querySelectorAll(".btn[data-product]")
        .forEach(button => {

            if (
                localStorage.getItem(
                    getKey(button)
                ) === "done"
            ) {

                button.classList.add("done");

                button.textContent =
                    "已抽過";

                button.closest("tr")
                    ?.classList.add("done-row");

            }

        });


    document
        .querySelectorAll("table")
        .forEach(sortTable);

}


document.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                ".btn[data-product]"
            );


        if (!button) {
            return;
        }


        localStorage.setItem(
            getKey(button),
            "done"
        );


        button.classList.add("done");

        button.textContent =
            "已抽過";


        button.closest("tr")
            ?.classList.add("done-row");


        const table =
            button.closest("table");


        if (table) {
            sortTable(table);
        }

    }
);


function resetRecords() {

    if (
        !confirm(
            "確定要清除 UX-21 / UX-20 / BX-35 的全部抽獎紀錄嗎？"
        )
    ) {
        return;
    }


    document
        .querySelectorAll(".btn[data-product]")
        .forEach(button => {

            localStorage.removeItem(
                getKey(button)
            );


            button.classList.remove("done");

            button.textContent =
                "立即抽獎";


            button.closest("tr")
                ?.classList.remove("done-row");

        });


    document
        .querySelectorAll("table")
        .forEach(sortTable);

}


renderProduct("ux21");
renderProduct("ux20");
renderProduct("bx35");

applyDoneState();
