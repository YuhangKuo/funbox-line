margin-top:26px}@media(max-width:560px){main{padding-top:18px}.topbar{align-items:flex-start;flex-direction:column}.head{display:none}.row{grid-template-columns:1fr auto;gap:7px 10px}.time{grid-column:1/-1;grid-row:2}.draw{grid-column:2;grid-row:1}.next.show{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<div class="topbar"><div><h1>Funbox 抽陀螺</h1><p class="meta">v2.1.2 · 2026/09/03 核對 · 台北市、新北市、桃園市、新竹市、新竹縣</p></div><button class="clear" id="clear-records" type="button">↩ 清除全部抽獎紀錄</button></div>
<div class="notice">只整理 BX-00 蒼龍神劍、BX-10、UX-20、UX-21、UX-19、BX-50。資料逐項依來源頁面核對；時間只採來源明示內容，不自行推測。</div>
<div class="tabs" id="tabs" aria-label="商品型號"></div>
<div class="next" id="next-box"><div class="next-text" id="next-text"></div><button class="next-button" id="next-button" type="button">打開下一個</button></div>
<div id="list"></div>
<footer>資料來源：Funbox / 來玩聚 LINE 官方帳號一鍵抽獎。點擊後會在此裝置記錄為已抽過。</footer>
</main>
<script>
const version="v2.1.2";
const products={bx00:"BX-00 蒼龍神劍",bx10:"BX-10 極限衝擊戰鬥盤",ux20:"UX-20 榮耀武神",ux21:"UX-21 惡魔冥界改造組",ux19:"UX-19 子彈獅鷲",bx50:"BX-50 天堂日輪"};
const shops=[
{region:"台北市",name:"Funbox 三越南西店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/safDqUe",ux20:"https://lin.ee/vneOzIi",ux21:"https://lin.ee/oD41qlW"},
{region:"台北市",name:"Fun box忠孝SOGO",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/ZxPrRKL",ux20:"https://lin.ee/89pxHTa",ux21:"https://lin.ee/ryTwnfS"},
{region:"台北市",name:"Funbox 美麗華",time:"9/4",bx00:"https://lin.ee/wWzOz0G",ux20:"https://lin.ee/YEjtQAn",ux21:"https://lin.ee/ojSXOr2"},
{region:"台北市",name:"Funbox天母三越店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/PLbLMXo"},
{region:"台北市",name:"Funbox-信義A8店(陀螺販售)",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/tXdvUyb",ux20:"https://lin.ee/Tw4w7OtZ",ux21:"https://lin.ee/O57EuiK"},
{region:"台北市",name:"Funbox-南港潤泰",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/7JT3H0I",bx50:"https://lin.ee/ymToMDv",ux19:"https://lin.ee/YtvvOG9",ux20:"https://lin.ee/p6sOG89"},
{region:"台北市",name:"Funbox 三越站前店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/YPG2HJk",ux20:"https://lin.ee/vYDc43J",ux21:"https://lin.ee/pyNpoPN"},
{region:"台北市",name:"Funbox 天母SOGO店",time:"9/4 11:00",bx00:"https://lin.ee/RcSDDix",ux20:"https://lin.ee/tFot4Guw",ux21:"https://lin.ee/pJjYgWw"},
{region:"台北市",name:"Funbox 遠百信義A13",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/6MXlzET",ux20:"https://lin.ee/QlgZ79L",ux21:"https://lin.ee/ydwCkmY"},
{region:"新北市",name:"Funbox板橋遠東店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/uVpfV2j",ux20:"https://lin.ee/U85OY6B",ux21:"https://lin.ee/W4YWfXL"},
{region:"新北市",name:"Funbox樹林秀泰店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/pVFQ7jG",ux20:"https://lin.ee/n5cDwZA",ux21:"https://lin.ee/wzgWKRj"},
{region:"新北市",name:"FunBox Toys-汐止遠雄店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/TUTxeDL",bx50:"https://lin.ee/9nllAXf",ux20:"https://lin.ee/pP9d1Px",ux21:"https://lin.ee/wd23sQ4"},
{region:"新北市",name:"Funbox新店誠品店",time:"9/4 11:00",bx00:"https://lin.ee/yWF0nkm",ux21:"https://lin.ee/p589taI"},
{region:"桃園市",name:"Funbox-桃園站前三越",time:"9/4 11:00~9/5 21:00",ux19:"https://lin.ee/yCscH9nD",ux21:"https://lin.ee/xI92MJV"},
{region:"新竹市",name:"Funbox-新竹遠東店",time:"9/4~9/5（營業時間 11:00~21:00）",bx00:"https://lin.ee/PuaKA54",ux20:"https://lin.ee/ReA7kmv",ux21:"https://lin.ee/PuWtTsF"},
{region:"新竹市",name:"Funbox-新竹遠雄店",time:"9/4~9/5",bx00:"https://lin.ee/P0vmXLA",ux20:"https://lin.ee/yNi1yX5",ux21:"https://lin.ee/YAjVHF3"},
{region:"新竹縣",name:"Funbox 竹北遠東店",time:"9/4 11:00~9/5 21:00",bx00:"https://lin.ee/oXP77Qm",ux20:"https://lin.ee/8KBl0s8",ux21:"https://lin.ee/YAjVHF3"}
];
const regions=["台北市","新北市","桃園市","新竹市","新竹縣"];
let activeProduct="ux21";
let nextShopIndex=null;
const recordKey=(product,shop)=>`funbox-${product}-${shop.region}-${shop.name}`;
const wasDrawn=(product,shop)=>localStorage.getItem(recordKey(product,shop))==="1";
function availableEntries(){return shops.filter(s=>s.region&&s[activeProduct]);}
function renderTabs(){document.querySelector("#tabs").innerHTML=Object.entries(products).map(([key,label])=>`<button class="tab ${key===activeProduct?"active":""}" type="button" data-product="${key}">${label}</button>`).join("")}
function renderNext(){const box=document.querySelector("#next-box");const text=document.querySelector("#next-text");if(nextShopIndex===null){box.classList.remove("show");return}const shop=shops[nextShopIndex];if(!shop||!shop[activeProduct]||wasDrawn(activeProduct,shop)){nextShopIndex=null;box.classList.remove("show");return}text.innerHTML=`<strong>下一個：${shop.name}</strong><span>${shop.region} · ${shop.time}</span>`;box.classList.add("show")}
function renderList(){document.querySelector("#list").innerHTML=regions.map(region=>{const entries=shops.filter(s=>s.region===region&&s[activeProduct]).sort((a,b)=>Number(wasDrawn(activeProduct,a))-Number(wasDrawn(activeProduct,b)));return `<section class="region"><h2>${region}</h2><div class="head"><span>門市</span><span>抽選時間</span><span>抽獎</span></div>${entries.length?entries.map(shop=>{const done=wasDrawn(activeProduct,shop);return `<div class="row ${done?"done":""}"><span class="shop">${shop.name}</span><span class="time">${shop.time}</span><a class="draw ${done?"done":""}" data-shop="${shops.indexOf(shop)}" href="${shop[activeProduct]}" target="_blank" rel="noopener">${done?"已抽過":"立即抽獎"}</a></div>`}).join(""):"<p class=\"empty\">目前沒有此型號的門市。</p>"}</section>`}).join("");renderNext()}
document.querySelector("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;activeProduct=b.dataset.product;nextShopIndex=null;renderTabs();renderList()});
document.querySelector("#list").addEventListener("click",e=>{const link=e.target.closest(".draw[data-shop]");if(!link)return;const index=Number(link.dataset.shop);localStorage.setItem(recordKey(activeProduct,shops[index]),"1");const next=shops.findIndex((shop,i)=>i>index&&shop[activeProduct]&&!wasDrawn(activeProduct,shop));nextShopIndex=next===-1?null:next;renderList()});
document.querySelector("#next-button").addEventListener("click",()=>{if(nextShopIndex===null)return;const shop=shops[nextShopIndex];if(!shop||!shop[activeProduct]||wasDrawn(activeProduct,shop)){renderList();return}window.open(shop[activeProduct],"_blank","noopener");localStorage.setItem(recordKey(activeProduct,shop),"1");const current=nextShopIndex;const next=shops.findIndex((item,i)=>i>current&&item[activeProduct]&&!wasDrawn(activeProduct,item));nextShopIndex=next===-1?null:next;renderList()});
document.querySelector("#clear-records").addEventListener("click",()=>{Object.keys(localStorage).filter(k=>k.startsWith("funbox-")).forEach(k=>localStorage.removeItem(k));nextShopIndex=null;renderList()});
renderTabs();renderList();
</script>
</body>
</html>
