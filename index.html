<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funbox 抽陀螺</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#24292f;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:900px;margin:0 auto;padding:24px 16px 40px}h1{margin:0;font-size:1.7rem}.meta{color:#667085;font-size:.9rem;margin:5px 0 18px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}button,select{font:inherit;cursor:pointer}.clear{border:0;background:none;color:#667085;padding:6px 0;font-size:.9rem;text-decoration:underline}.source{margin:-8px 0 18px;font-size:.9rem}.source a{color:#2563eb;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:#334155;color:#fff;border-color:#334155}.filters{display:flex;align-items:center;gap:10px;margin:0 0 12px}.filters label{color:#64748b;font-size:.9rem;font-weight:700}.time-filter{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:7px;padding:8px 10px}.summary{color:#64748b;font-size:.9rem;margin:0 0 22px}.region{margin:24px 0}.region h2{border-bottom:2px solid #94a3b8;font-size:1.1rem;margin:0 0 8px;padding-bottom:7px}.head,.row{display:grid;grid-template-columns:minmax(0,1fr) 170px 106px;gap:12px;align-items:center}.head{color:#64748b;font-size:.8rem;font-weight:700;padding:6px 10px}.row{background:#fff;border-radius:10px;margin:7px 0;padding:10px;box-shadow:0 1px 2px rgb(15 23 42 / .08)}.row.done{opacity:.55}.shop{font-weight:700}.time{color:#64748b;font-size:.9rem}.draw{text-decoration:none;text-align:center;background:#08a33a;color:#fff;padding:8px 10px;border-radius:7px;font-weight:700;font-size:.88rem}.draw.done{background:#94a3b8}.empty{color:#64748b;padding:12px 0}.next{display:none;margin:0 0 18px;padding:12px 14px;background:#fff;border:1px solid #cbd5e1;border-radius:10px}.next.show{display:flex;justify-content:space-between;gap:12px;align-items:center}.next-text{font-size:.9rem}.next-text strong{display:block}.next-button{border:0;background:#334155;color:#fff;border-radius:7px;padding:8px 12px;font-weight:700;white-space:nowrap}footer{color:#64748b;font-size:.78rem;margin-top:26px}@media(max-width:560px){main{padding-top:18px}.topbar{align-items:flex-start;flex-direction:column}.filters{align-items:flex-start;flex-direction:column;gap:6px}.head{display:none}.row{grid-template-columns:1fr auto;gap:7px 10px}.time{grid-column:1/-1;grid-row:2}.draw{grid-column:2;grid-row:1}.next.show{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<div class="topbar"><div><h1>Funbox 抽陀螺</h1><p class="meta">v2.3.4 · 2026/09/10 核對 · 台北市、新北市、桃園市、新竹市、新竹縣</p></div><button class="clear" id="clear-records" type="button">↩ 清除全部抽獎紀錄</button></div>
<div class="source">資料來源：<a href="https://uxux11.github.io/funbox-line/" target="_blank" rel="noopener">Funbox / 來玩聚 LINE 官方帳號一鍵抽獎</a></div>
<div class="tabs" id="tabs" aria-label="商品型號"></div>
<div class="filters"><label for="time-filter">抽選時間</label><select class="time-filter" id="time-filter"><option value="all">全部</option></select></div>
<div class="summary" id="summary"></div>
<div class="next" id="next-box"><div class="next-text" id="next-text"></div><button class="next-button" id="next-button" type="button">打開下一個</button></div>
<div id="list"></div>
<footer>點擊後會在此裝置記錄為已抽過。</footer>
</main>
<script>
const version="v2.3.4";
const products={bx00:"BX-00 蒼龍神劍",bx10:"BX-10 極限衝擊戰鬥盤",bx35:"BX-35 隨機強化組Vol.04",ux15:"UX-15 鮫鯊狂鱗改造組",ux20:"UX-20 榮耀武神",ux21:"UX-21 惡魔冥界改造組",ux19:"UX-19 子彈獅鷲",bx50:"BX-50 天堂日輪",cx00:"CX-00 新世紀福音戰士改造組"};
const shops=[
{region:"台北市",name:"Funbox-南港潤泰店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/79aYEfH",ux20:"https://lin.ee/9l323EP",ux21:"https://lin.ee/RyT9nk9",cx00:"https://lin.ee/9ORwvJh"},
{region:"台北市",name:"來玩聚-北車地下街",time:"9/11 12:00~9/12 20:30",bx00:"https://lin.ee/ZDvzc3y",ux21:"https://lin.ee/YUyfSal"},
{region:"台北市",name:"Fun box忠孝SOGO",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/Q3x58xY",cx00:"https://lin.ee/Teeti1U"},
{region:"台北市",name:"Funbox 天母SOGO店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/y4j0PVB",cx00:"https://lin.ee/uq6jtZa"},
{region:"台北市",name:"Funbox-信義A8店(陀螺販售)",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/NsYCTEy",cx00:"https://lin.ee/U0irnFS"},
{region:"台北市",name:"Funbox 三越站前店",time:"9/11 11:00~9/12 21:00",cx00:"https://lin.ee/wNVQFEw"},
{region:"台北市",name:"Funbox天母三越店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/629xw4m",cx00:"https://lin.ee/rFVhsbI"},
{region:"台北市",name:"Funbox LaLaport南港",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/x1u6Knk",cx00:"https://lin.ee/pncsz8S"},
{region:"新北市",name:"Funbox板橋遠東店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/p6Hm7YO",ux20:"https://lin.ee/yKmsW9Y",ux21:"https://lin.ee/Q7Ubro4",cx00:"https://lin.ee/vAF5QKG"},
{region:"新北市",name:"FunBox Toys-汐止遠雄店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/n6US1jV",ux21:"https://lin.ee/8552VhL",cx00:"https://lin.ee/UHqMK5X"},
{region:"新北市",name:"Funbox新店誠品店",time:"9/11 11:00 起",bx00:"https://lin.ee/r1IXPQE",cx00:"https://lin.ee/51lxU5K"},
{region:"新北市",name:"Funbox樹林秀泰店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/sCU4pitK",bx10:"https://lin.ee/qVQi9m3",ux21:"https://lin.ee/7dR60o7",cx00:"https://lin.ee/nMMo9F9"},
{region:"桃園市",name:"Funbox-桃園站前三越",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/x6yzH8p",ux20:"https://lin.ee/9l323EP",ux21:"https://lin.ee/RyT9nk9",bx50:"https://lin.ee/qUn33fe",cx00:"https://lin.ee/nQmhrsZ"},
{region:"新竹市",name:"Funbox-新竹遠東店",time:"9/11~9/12（營業時間 11:00~21:00）",bx00:"https://lin.ee/ppQFtam",cx00:"https://lin.ee/nwUL9bje"},
{region:"新竹市",name:"Funbox-新竹遠雄店",time:"9/11~9/12",bx00:"https://lin.ee/nM1oXtf",ux21:"https://lin.ee/5mqMzNZ",cx00:"https://lin.ee/ofEN0zN"},
{region:"新竹縣",name:"Funbox 竹北遠東店",time:"9/11 11:00~9/12 21:00",bx00:"https://lin.ee/ZLPUmoH",ux20:"https://lin.ee/WaOcOXM",cx00:"https://lin.ee/nAdCSiL"}
];
const regions=["台北市","新北市","桃園市","新竹市","新竹縣"];
let activeProduct="ux21";
let nextShopIndex=null;
let activeTime="all";
const recordKey=(product,shop)=>`funbox-${product}-${shop.region}-${shop.name}`;
const wasDrawn=(product,shop)=>localStorage.getItem(recordKey(product,shop))==="1";
function getStartTime(time){const match=time.match(/\d+\/\d+\s+(\d{1,2}:\d{2})/);return match?match[1]:"all-day"}
function timeMatches(shop){return activeTime==="all"||getStartTime(shop.time)===activeTime}
function filteredEntries(){return shops.filter(s=>s[activeProduct]&&timeMatches(s))}
function orderedEntries(){return regions.flatMap(region=>shops.filter(s=>s.region===region&&s[activeProduct]&&timeMatches(s)).sort((a,b)=>Number(wasDrawn(activeProduct,a))-Number(wasDrawn(activeProduct,b))));}
function findNextIndex(afterIndex=null){const ordered=orderedEntries();if(!ordered.length)return null;const start=afterIndex===null?0:ordered.findIndex(s=>s===shops[afterIndex])+1;for(let i=Math.max(start,0);i<ordered.length;i++){if(!wasDrawn(activeProduct,ordered[i]))return shops.indexOf(ordered[i])}for(let i=0;i<Math.max(start,0);i++){if(!wasDrawn(activeProduct,ordered[i]))return shops.indexOf(ordered[i])}return null;}
function renderTabs(){document.querySelector("#tabs").innerHTML=Object.entries(products).map(([key,label])=>`<button class="tab ${key===activeProduct?"active":""}" type="button" data-product="${key}">${label}</button>`).join("")}
function renderTimeFilter(){const select=document.querySelector("#time-filter");const times=[...new Set(shops.map(getStartTime))].filter(t=>t!=="all-day").sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));select.innerHTML='<option value="all">全部</option>'+times.map(t=>`<option value="${t}">${t} 開始</option>`).join("");select.value=activeTime}
function renderSummary(){const entries=filteredEntries();const drawn=entries.filter(s=>wasDrawn(activeProduct,s)).length;document.querySelector("#summary").textContent=`已抽 ${drawn} / ${entries.length} · 剩餘 ${entries.length-drawn}`}
function renderNext(){const box=document.querySelector("#next-box");const text=document.querySelector("#next-text");if(nextShopIndex===null){box.classList.remove("show");return}const shop=shops[nextShopIndex];if(!shop||!shop[activeProduct]||!timeMatches(shop)||wasDrawn(activeProduct,shop)){nextShopIndex=findNextIndex();if(nextShopIndex===null){box.classList.remove("show");return}}const nextShop=shops[nextShopIndex];text.innerHTML=`<strong>下一個：${nextShop.name}</strong><span>${nextShop.region} · ${nextShop.time}</span>`;box.classList.add("show")}
function renderList(){document.querySelector("#list").innerHTML=regions.map(region=>{const entries=shops.filter(s=>s.region===region&&s[activeProduct]&&timeMatches(s)).sort((a,b)=>Number(wasDrawn(activeProduct,a))-Number(wasDrawn(activeProduct,b)));return `<section class="region"><h2>${region}</h2><div class="head"><span>門市</span><span>抽選時間</span><span>抽獎</span></div>${entries.length?entries.map(shop=>{const done=wasDrawn(activeProduct,shop);return `<div class="row ${done?"done":""}"><span class="shop">${shop.name}</span><span class="time">${shop.time}</span><a class="draw ${done?"done":""}" data-shop="${shops.indexOf(shop)}" href="${shop[activeProduct]}" target="_blank" rel="noopener">${done?"已抽過":"立即抽獎"}</a></div>`}).join(""):"<p class=\"empty\">目前沒有符合此篩選條件的門市。</p>"}</section>`}).join("");renderSummary();renderNext()}
document.querySelector("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;activeProduct=b.dataset.product;nextShopIndex=null;renderTabs();renderList()});
document.querySelector("#time-filter").addEventListener("change",e=>{activeTime=e.target.value;nextShopIndex=null;renderList()});
document.querySelector("#list").addEventListener("click",e=>{const link=e.target.closest(".draw[data-shop]");if(!link)return;const index=Number(link.dataset.shop);localStorage.setItem(recordKey(activeProduct,shops[index]),"1");nextShopIndex=findNextIndex(index);renderList()});
document.querySelector("#next-button").addEventListener("click",()=>{if(nextShopIndex===null)return;const shop=shops[nextShopIndex];if(!shop||!shop[activeProduct]||!timeMatches(shop)||wasDrawn(activeProduct,shop)){nextShopIndex=findNextIndex();renderNext();return}localStorage.setItem(recordKey(activeProduct,shop),"1");window.open(shop[activeProduct],"_blank","noopener");nextShopIndex=findNextIndex(nextShopIndex);renderList()});
document.querySelector("#clear-records").addEventListener("click",()=>{Object.keys(localStorage).filter(k=>k.startsWith("funbox-")).forEach(k=>localStorage.removeItem(k));nextShopIndex=null;renderList()});
renderTabs();renderTimeFilter();renderList();
</script>
</body>
</html>
