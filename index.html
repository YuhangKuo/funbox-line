];
const regions=["台北市","新北市","桃園市","新竹市","新竹縣"];
let activeProduct="bx00",nextShopIndex=null,activeTime="all";
const recordKey=(product,shop)=>`funbox-${product}-${shop.region}-${shop.name}`;
const wasDrawn=(product,shop)=>localStorage.getItem(recordKey(product,shop))==="1";
function getTimeKey(shop){const m=(shop.time||"").match(/(\d+\/\d+)\s+(\d{1,2}:\d{2})/);return m?`${m[1]} ${m[2]}`:null}
function timeMatches(shop){return activeTime==="all"||getTimeKey(shop)===activeTime}
function filteredEntries(){return shops.filter(s=>s[activeProduct]&&timeMatches(s))}
function orderedEntries(){return regions.flatMap(r=>shops.filter(s=>s.region===r&&s[activeProduct]&&timeMatches(s)).sort((a,b)=>Number(wasDrawn(activeProduct,a))-Number(wasDrawn(activeProduct,b))))}
function findNextIndex(afterIndex=null){const o=orderedEntries();if(!o.length)return null;const p=afterIndex===null?-1:o.findIndex(s=>s===shops[afterIndex]);for(let i=p+1;i<o.length;i++)if(!wasDrawn(activeProduct,o[i]))return shops.indexOf(o[i]);for(let i=0;i<=p;i++)if(!wasDrawn(activeProduct,o[i]))return shops.indexOf(o[i]);return null}
function renderTabs(){const available=Object.entries(products).filter(([k])=>shops.some(s=>s[k]));if(!available.some(([k])=>k===activeProduct))activeProduct=available[0]?.[0]||"";document.querySelector("#tabs").innerHTML=available.map(([k,l])=>`<button class="tab ${k===activeProduct?"active":""}" type="button" data-product="${k}">${l}</button>`).join("")}
function renderTimeFilter(){const s=document.querySelector("#time-filter"),t=[...new Set(shops.map(getTimeKey).filter(Boolean))].sort();s.innerHTML='<option value="all">全部</option>'+t.map(x=>`<option value="${x}">${x}</option>`).join("");s.value=activeTime}
function renderSummary(){const e=filteredEntries(),d=e.filter(s=>wasDrawn(activeProduct,s)).length;document.querySelector("#summary").textContent=`已抽 ${d} / ${e.length} · 剩餘 ${e.length-d}`}
function renderNext(){const b=document.querySelector("#next-box"),t=document.querySelector("#next-text");if(nextShopIndex===null){b.classList.remove("show");return}const s=shops[nextShopIndex];if(!s||!s[activeProduct]||!timeMatches(s)||wasDrawn(activeProduct,s)){nextShopIndex=findNextIndex();if(nextShopIndex===null){b.classList.remove("show");return}}const n=shops[nextShopIndex];t.innerHTML=`<strong>下一個：${n.name}</strong><span>${n.region} · ${n.time||"來源未提供時間"}</span>`;b.classList.add("show")}
function renderList(){document.querySelector("#list").innerHTML=regions.map(r=>{const e=shops.filter(s=>s.region===r&&s[activeProduct]&&timeMatches(s)).sort((a,b)=>Number(wasDrawn(activeProduct,a))-Number(wasDrawn(activeProduct,b)));return `<section class="region"><h2>${r}</h2><div class="head"><span>門市</span><span>抽選時間</span><span>抽獎</span></div>${e.length?e.map(s=>{const d=wasDrawn(activeProduct,s);return `<div class="row ${d?"done":""}"><span class="shop">${s.name}</span><span class="time">${s.time||"來源未提供時間"}</span><a class="draw ${d?"done":""}" data-shop="${shops.indexOf(s)}" href="${s[activeProduct]}" target="_blank" rel="noopener">${d?"已抽過":"立即抽獎"}</a></div>`}).join(""):"<p class=\"empty\">目前沒有符合此篩選條件的門市。</p>"}</section>`}).join("");renderSummary();renderNext()}
document.querySelector("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;activeProduct=b.dataset.product;nextShopIndex=null;renderTabs();renderList()});
document.querySelector("#time-filter").addEventListener("change",e=>{activeTime=e.target.value;nextShopIndex=null;renderList()});
document.querySelector("#list").addEventListener("click",e=>{const l=e.target.closest(".draw[data-shop]");if(!l)return;const i=Number(l.dataset.shop);localStorage.setItem(recordKey(activeProduct,shops[i]),"1");nextShopIndex=findNextIndex(i);renderList()});
document.querySelector("#next-button").addEventListener("click",()=>{if(nextShopIndex===null)return;const s=shops[nextShopIndex];if(!s||!s[activeProduct]||!timeMatches(s)||wasDrawn(activeProduct,s)){nextShopIndex=findNextIndex();renderNext();return}localStorage.setItem(recordKey(activeProduct,s),"1");window.open(s[activeProduct],"_blank","noopener");nextShopIndex=findNextIndex(nextShopIndex);renderList()});
document.querySelector("#clear-records").addEventListener("click",()=>{Object.keys(localStorage).filter(k=>k.startsWith("funbox-")).forEach(k=>localStorage.removeItem(k));nextShopIndex=null;renderList()});
