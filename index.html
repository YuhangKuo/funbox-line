<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Funbox 抽獎</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, "Noto Sans TC",
                 "Microsoft JhengHei", sans-serif;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 14px;
    line-height: 1.6;
    background: #f7f7f7;
    color: #222;
}

h1 {
    font-size: 1.55rem;
    margin: 0 0 4px;
}

.subtitle {
    color: #666;
    font-size: .9rem;
    margin-bottom: 16px;
}

.note {
    background: #fff3cd;
    padding: 11px 13px;
    border-radius: 9px;
    margin-bottom: 16px;
    font-size: .88rem;
}

.product-select {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 22px;
}

.product-btn {
    border: 2px solid #ddd;
    background: white;
    padding: 11px 8px;
    border-radius: 9px;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 700;
}

.product-btn.active {
    background: #222;
    color: white;
    border-color: #222;
}

.product-content {
    display: none;
}

.product-content.active {
    display: block;
}

.product-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 12px;
}

.region {
    margin-top: 22px;
}

.region h2 {
    background: #222;
    color: white;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 1.05rem;
    margin-bottom: 8px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: white;
    border-radius: 9px;
    overflow: hidden;
}

th,
td {
    padding: 9px 11px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

tr:last-child td {
    border-bottom: none;
}

.time {
    white-space: nowrap;
    color: #c33;
    font-size: .85rem;
}

.btn {
    display: inline-block;
    min-width: 86px;
    text-align: center;
    background: #06c755;
    color: white;
    text-decoration: none;
    padding: 7px 11px;
    border-radius: 7px;
    font-weight: 700;
    white-space: nowrap;
}

.btn:hover {
    opacity: .85;
}

.btn.done {
    background: #999;
    opacity: .55;
}

tr.done-row {
    opacity: .45;
}

.reset-btn {
    border: 0;
    background: #666;
    color: white;
    padding: 8px 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: .85rem;
    margin-bottom: 16px;
}

footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
    color: #777;
    font-size: .8rem;
}

footer a {
    color: inherit;
}

@media (max-width: 600px) {

    body {
        margin: 14px auto;
        padding: 0 10px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .product-select {
        grid-template-columns: 1fr;
    }

    .product-btn {
        padding: 12px;
    }

    thead {
        display: none;
    }

    table,
    tbody,
    tr,
    td {
        display: block;
        width: 100%;
    }

    tr {
        background: white;
        margin-bottom: 8px;
        padding: 10px 11px;
        border-radius: 9px;
        border: 1px solid #e5e5e5;
    }

    td {
        border: none;
        padding: 0;
    }

    td:first-child {
        font-weight: 700;
    }

    td:nth-child(2) {
        margin-top: 2px;
        margin-bottom: 8px;
    }

    .time {
        white-space: normal;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 9px;
    }

    .reset-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<h1>Funbox 抽獎</h1>

<div class="subtitle">
2026/08/29｜台北・新北・桃園・新竹
</div>

<button class="reset-btn" onclick="resetRecords()">
↩ 清除全部抽獎紀錄
</button>

<div class="note">
⚠️ 各門市開始時間可能不同，請依門市標示時間抽獎。
<br>
⚫ 抽過後會自動記錄，並移到該地區最下面。
</div>


<!-- =========================================================
     品項選擇
========================================================= -->

<div class="product-select">

<button class="product-btn active"
onclick="showProduct('ux21', this)">
UX-21
</button>

<button class="product-btn"
onclick="showProduct('ux20', this)">
UX-20
</button>

<button class="product-btn"
onclick="showProduct('bx35', this)">
BX-35

</div>

     內容由 JavaScript 產生
========================================================= -->

資料來源：

target="_blank"
rel="noopener">
Funbox / 來玩聚 LINE 官方帳號一鍵抽獎

/* =========================================================
   品項設定
========================================================= */

const products = {

    ux21: {
        title: "UX-21 惡魔冥界改造組"
    },

    ux20: {
        title: "UX-20 榮耀武神"
    },

    bx35: {
        title: "BX-35 隨機強化組 Vol.04"
    }

};


/* =========================================================
   產生門市清單
========================================================= */

function renderProduct(product) {

    const container =
        document.getElementById(product);

    container.innerHTML = "";

    const title =
        document.createElement("div");

    title.className = "product-title";
    title.textContent =
        products[product].title;

    container.appendChild(title);


    const regions = [];

    shops.forEach(shop => {

        if (!shop[product]) {
            return;
        }

        if (!regions.includes(shop.region)) {
            regions.push(shop.region);
        }

    });


    regions.forEach(region => {

        const regionDiv =
            document.createElement("div");

        regionDiv.className = "region";


        const heading =
            document.createElement("h2");

        heading.textContent = region;

        regionDiv.appendChild(heading);


        const table =
            document.createElement("table");


        const thead =
            document.createElement("thead");

        thead.innerHTML = `
            <tr>
                <th>門市</th>
                <th>開始時間</th>
                <th>抽獎</th>
            </tr>
        `;

        table.appendChild(thead);


        const tbody =
            document.createElement("tbody");


        shops
        .filter(shop =>
            shop.region === region &&
            shop[product]
        )
        .forEach(shop => {

            const tr =
                document.createElement("tr");


            const tdName =
                document.createElement("td");

            tdName.textContent =
                shop.name;


            const tdTime =
                document.createElement("td");

            tdTime.className = "time";

            tdTime.textContent =
                shop.time;


            const tdButton =
                document.createElement("td");


            const button =
                document.createElement("a");

            button.className = "btn";

            button.href =
                shop[product];

            button.target = "_blank";
            button.rel = "noopener";

            button.dataset.product =
                product;

            button.dataset.shop =
                createShopId(shop.name);


            button.textContent =
                "立即抽獎";


            tdButton.appendChild(button);

            tr.appendChild(tdName);
            tr.appendChild(tdTime);
            tr.appendChild(tdButton);

            tbody.appendChild(tr);

        });


        table.appendChild(tbody);

        regionDiv.appendChild(table);

        container.appendChild(regionDiv);

    });

}


/* =========================================================
   建立穩定的 localStorage ID
========================================================= */

function createShopId(name) {

    return name
        .replace(/\s+/g, "")
        .replace(/[^\u4e00-\u9fffA-Za-z0-9]/g, "");

}


/* =========================================================
   顯示品項
========================================================= */

function showProduct(product, button) {

    document
        .querySelectorAll(".product-content")
        .forEach(content => {

            content.classList.remove("active");

        });


    document
        .getElementById(product)
        .classList.add("active");


    document
        .querySelectorAll(".product-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");

}


/* =========================================================
   localStorage Key
========================================================= */

function getKey(button) {

    return "funbox-" +
           button.dataset.product +
           "-" +
           button.dataset.shop;

}


/* =========================================================
   套用已抽過狀態
========================================================= */

function applyDoneState() {

    document
        .querySelectorAll(".btn[data-product]")
        .forEach(button => {

            const key =
                getKey(button);

            if (
                localStorage.getItem(key)
                === "done"
            ) {

                button.classList.add("done");
                button.textContent =
                    "已抽過";

                button.closest("tr")
                    ?.classList.add("done-row");

            }

        });


    document
        .querySelectorAll("table")
        .forEach(sortTable);

}


/* =========================================================
   已抽過 → 移到最下面
========================================================= */

function sortTable(table) {

    const tbody =
        table.querySelector("tbody");

    if (!tbody) {
        return;
    }


    const rows =
        Array.from(
            tbody.querySelectorAll("tr")
        );


    rows.sort((a, b) => {

        const aButton =
            a.querySelector(".btn");

        const bButton =
            b.querySelector(".btn");


        if (!aButton || !bButton) {
            return 0;
        }


        const aDone =
            localStorage.getItem(
                getKey(aButton)
            ) === "done";


        const bDone =
            localStorage.getItem(
                getKey(bButton)
            ) === "done";


        if (aDone && !bDone) {
            return 1;
        }

        if (!aDone && bDone) {
            return -1;
        }

        return 0;

    });


    rows.forEach(row => {

        tbody.appendChild(row);

    });

}


/* =========================================================
   點擊抽獎
========================================================= */

document.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                ".btn[data-product]"
            );


        if (!button) {
            return;
        }


        const key =
            getKey(button);


        localStorage.setItem(
            key,
            "done"
        );


        button.classList.add("done");

        button.textContent =
            "已抽過";


        button.closest("tr")
            ?.classList.add("done-row");


        const table =
            button.closest("table");


        if (table) {
            sortTable(table);
        }

    }
);


/* =========================================================
   清除全部紀錄
========================================================= */

function resetRecords() {

    if (
        !confirm(
            "確定要清除 UX-21 / UX-20 / BX-35 的全部抽獎紀錄嗎？"
        )
    ) {
        return;
    }


    document
        .querySelectorAll(".btn[data-product]")
        .forEach(button => {

            localStorage.removeItem(
                getKey(button)
            );


            button.classList.remove("done");

            button.textContent =
                "立即抽獎";


            button.closest("tr")
                ?.classList.remove("done-row");

        });


    document
        .querySelectorAll("table")
        .forEach(sortTable);

}


/* =========================================================
   初始化
========================================================= */

renderProduct("ux21");
renderProduct("ux20");
renderProduct("bx35");

applyDoneState();

</script>
