<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funbox 抽陀螺</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f3f5; color: #24292f; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0; font-size: 1.7rem; }
    .meta { color: #667085; font-size: .9rem; margin: 5px 0 18px; }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
    button { font: inherit; cursor: pointer; }
    .clear { border: 0; background: none; color: #667085; padding: 6px 0; font-size: .9rem; text-decoration: underline; }
    .notice { background: #fff8db; border: 1px solid #f0d98d; border-radius: 10px; padding: 12px; color: #66511a; font-size: .88rem; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .tab { border: 1px solid #cbd5e1; background: #fff; color: #334155; border-radius: 999px; padding: 9px 14px; font-weight: 700; }
    .tab.active { background: #334155; color: #fff; border-color: #334155; }
    .region { margin: 24px 0; }
    .region h2 { border-bottom: 2px solid #94a3b8; font-size: 1.1rem; margin: 0 0 8px; padding-bottom: 7px; }
    .head, .row { display: grid; grid-template-columns: minmax(0, 1fr) 118px 106px; gap: 12px; align-items: center; }
    .head { color: #64748b; font-size: .8rem; font-weight: 700; padding: 6px 10px; }
    .row { background: #fff; border-radius: 10px; margin: 7px 0; padding: 10px; box-shadow: 0 1px 2px rgb(15 23 42 / .08); }
    .row.done { opacity: .55; }
    .shop { font-weight: 700; }
    .time { color: #64748b; font-size: .9rem; }
    .draw { text-decoration: none; text-align: center; background: #08a33a; color: #fff; padding: 8px 10px; border-radius: 7px; font-weight: 700; font-size: .88rem; }
    .draw.done { background: #94a3b8; }
    .empty { color: #64748b; padding: 12px 0; }
    footer { color: #64748b; font-size: .78rem; margin-top: 26px; }
    @media (max-width: 560px) {
      main { padding-top: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .head { display: none; }
      .row { grid-template-columns: 1fr auto; gap: 7px 10px; }
      .time { grid-column: 1 / -1; grid-row: 2; }
      .draw { grid-column: 2; grid-row: 1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1>Funbox 抽陀螺</h1>
        <p class="meta">v2.0.1 · 2026/08/29 核對 · 台北市、新北市、桃園市、新竹市、新竹縣</p>
      </div>
      <button class="clear" id="clear-records" type="button">↩ 清除全部抽獎紀錄</button>
    </div>
    <div class="notice">只整理 UX-21、UX-20、BX-35。開始時間僅在來源個別商品有標示時顯示；其餘不推測。</div>
    <div class="tabs" id="tabs" aria-label="商品型號"></div>
    <div id="list"></div>
    <footer>資料來源：Funbox / 來玩聚 LINE 官方帳號一鍵抽獎。點擊後會在此裝置記錄為已抽過。</footer>
  </main>

  <script>
    const version = "v2.0.1";

    const products = {
      ux21: "UX-21 惡魔冥界改造組",
      ux20: "UX-20 榮耀武神",
      bx35: "BX-35"
    };

    const shops = [
      { region: "台北市", name: "Fun box忠孝SOGO", ux21: { url: "https://lin.ee/QsQzRTL", time: "8/29 11:00" } },
      { region: "台北市", name: "Funbox天母三越店", ux21: { url: "https://lin.ee/UKM6TKK", time: "8/29 11:00" }, ux20: { url: "https://lin.ee/wBvFN2J", time: "未標明" }, bx35: { url: "https://lin.ee/sjANMnS", time: "未標明" } },
      { region: "台北市", name: "Funbox-信義A8店(陀螺販售)", ux21: { url: "https://lin.ee/q97O5u7", time: "8/29 11:00" } },
      { region: "台北市", name: "Funbox 天母SOGO店", ux21: { url: "https://lin.ee/Xqa4sFy", time: "未標明" } },
      { region: "台北市", name: "Funbox Toys-大葉高島屋", ux20: { url: "https://lin.ee/8WUY2KX", time: "未標明" }, bx35: { url: "https://lin.ee/NzS2cxEK", time: "未標明" } },
      { region: "台北市", name: "Funbox-南港潤泰", ux21: { url: "https://lin.ee/zGviPVx", time: "8/29 11:00" }, ux20: { url: "https://lin.ee/xHpCF14", time: "未標明" }, bx35: { url: "https://lin.ee/x2sZbiB", time: "未標明" } },
      { region: "台北市", name: "來玩聚-北車地下街", ux20: { url: "https://lin.ee/OXTR7l3", time: "未標明" }, bx35: { url: "https://lin.ee/NmI5pyX", time: "未標明" } },
      { region: "台北市", name: "Funbox 美麗華", ux21: { url: "https://lin.ee/Suuh0WP", time: "未標明" }, bx35: { url: "https://lin.ee/WZOYsDS", time: "未標明" } },
      { region: "台北市", name: "Funbox LaLaport南港", ux21: { url: "https://lin.ee/wxDyuiT", time: "未標明" }, ux20: { url: "https://lin.ee/qHTOOuh", time: "未標明" }, bx35: { url: "https://lin.ee/QtIsgeh", time: "未標明" } },
      { region: "台北市", name: "Funbox 三越南西店", ux21: { url: "https://lin.ee/xAesOXg", time: "未標明" }, bx35: { url: "https://lin.ee/obbbKzJ", time: "未標明" } },
      { region: "新北市", name: "FunBox Toys-汐止遠雄店", ux20: { url: "https://lin.ee/OW8V3OF", time: "未標明" }, bx35: { url: "https://lin.ee/S2hCveN", time: "未標明" } },
      { region: "新北市", name: "Funbox板橋遠東店", ux20: { url: "https://lin.ee/To1hX0R", time: "未標明" }, bx35: { url: "https://lin.ee/zkA1diW", time: "未標明" } },
      { region: "新北市", name: "Funbox板橋大遠百", ux20: { url: "https://lin.ee/8PXerlh", time: "未標明" } },
      { region: "桃園市", name: "Funbox-桃園站前三越", ux21: { url: "https://lin.ee/Q5emiZW", time: "8/29 11:00" }, bx35: { url: "https://lin.ee/WHbtrMP", time: "未標明" } },
      { region: "桃園市", name: "Funbox toys - 桃園台茂店", ux21: { url: "https://lin.ee/Oh1dSHD", time: "8/29 11:00" } },
      { region: "桃園市", name: "FunBox - 中壢SOGO店", ux21: { url: "https://lin.ee/p2JKdr5", time: "未標明" } },
      { region: "桃園市", name: "FunBox - 桃園環球A19店", ux20: { url: "https://lin.ee/qMm25ZE", time: "未標明" }, bx35: { url: "https://lin.ee/PHFLgAV", time: "未標明" } },
      { region: "桃園市", name: "Funbox-桃園遠東店", ux21: { url: "https://lin.ee/qESRK9p", time: "未標明" } },
      { region: "桃園市", name: "Funbox 中壢大江店", ux21: { url: "https://lin.ee/8Bv63tO", time: "8/29 11:00" }, ux20: { url: "https://lin.ee/nua1iCT", time: "未標明" } },
      { region: "桃園市", name: "Funbox-桃園環球A8店", ux21: { url: "https://lin.ee/9496mkz", time: "8/29 11:00" }, ux20: { url: "https://lin.ee/re25qAN", time: "未標明" }, bx35: { url: "https://lin.ee/nBQY3g3", time: "未標明" } },
      { region: "新竹市", name: "Funbox-新竹遠東店", ux21: { url: "https://lin.ee/9cp66iv", time: "8/29 11:00" } },
      { region: "新竹市", name: "Fun Box 新竹巨城", ux20: { url: "https://lin.ee/826H1QK", time: "未標明" }, bx35: { url: "https://lin.ee/wOpQsrO", time: "未標明" } },
      { region: "新竹縣", name: "Funbox 竹北遠東店", ux21: { url: "https://lin.ee/nhfKgsb", time: "8/29 11:00" }, bx35: { url: "https://lin.ee/tf7TuZU", time: "未標明" } },
      { region: "新竹縣", name: "funbox 享平方店", ux21: { url: "https://lin.ee/RVqOUW4", time: "8/29 11:00" }, ux20: { url: "https://lin.ee/9TxB7HY", time: "未標明" }, bx35: { url: "https://lin.ee/y2nw5fI", time: "未標明" } }
    ];

    const regions = ["台北市", "新北市", "桃園市", "新竹市", "新竹縣"];
    let activeProduct = "ux21";
    const recordKey = (product, shop) => `funbox-${product}-${shop.region}-${shop.name}`;
    const wasDrawn = (product, shop) => localStorage.getItem(recordKey(product, shop)) === "1";

    function renderTabs() {
      document.querySelector("#tabs").innerHTML = Object.entries(products).map(([key, label]) =>
        `<button class="tab ${key === activeProduct ? "active" : ""}" type="button" data-product="${key}">${label}</button>`
      ).join("");
    }

    function renderList() {
      const list = document.querySelector("#list");
      list.innerHTML = regions.map(region => {
        const entries = shops.filter(shop => shop.region === region && shop[activeProduct])
          .sort((a, b) => Number(wasDrawn(activeProduct, a)) - Number(wasDrawn(activeProduct, b)));
        return `<section class="region"><h2>${region}</h2><div class="head"><span>門市</span><span>開始時間</span><span>抽獎</span></div>${entries.length ? entries.map(shop => {
          const drawn = wasDrawn(activeProduct, shop);
          return `<div class="row ${drawn ? "done" : ""}"><span class="shop">${shop.name}</span><span class="time">${shop[activeProduct].time}</span><a class="draw ${drawn ? "done" : ""}" data-shop="${shops.indexOf(shop)}" href="${shop[activeProduct].url}" target="_blank" rel="noopener">${drawn ? "已抽過" : "立即抽獎"}</a></div>`;
        }).join("") : '<p class="empty">目前沒有此型號的門市。</p>'}</section>`;
      }).join("");
    }

    document.querySelector("#tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-product]");
      if (!button) return;
      activeProduct = button.dataset.product;
      renderTabs();
      renderList();
    });

    document.querySelector("#list").addEventListener("click", event => {
      const link = event.target.closest(".draw[data-shop]");
      if (!link) return;
      const shop = shops[Number(link.dataset.shop)];
      localStorage.setItem(recordKey(activeProduct, shop), "1");
      renderList();
    });

    document.querySelector("#clear-records").addEventListener("click", () => {
      if (!confirm("確定要清除 UX-21 / UX-20 / BX-35 的全部抽獎紀錄嗎？")) return;
      Object.keys(localStorage).filter(key => key.startsWith("funbox-ux21-") || key.startsWith("funbox-ux20-") || key.startsWith("funbox-bx35-")).forEach(key => localStorage.removeItem(key));
      renderList();
    });

    renderTabs();
    renderList();
  </script>
</body>
</html>
